appId: com.cawlino.gerenciadorgastos
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "dashboard-checking-balance"
    timeout: 20000
- assertVisible: "Painel"
- assertVisible:
    id: "dashboard-month-switcher"
- assertVisible:
    id: "dashboard-income-card"
- assertVisible:
    id: "dashboard-expense-card"
- tapOn:
    id: "month-prev"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "dashboard-checking-balance"
    timeout: 15000
- tapOn:
    id: "month-next"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "dashboard-checking-balance"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "dashboard-credit-card"
    direction: DOWN
    speed: 55
    visibilityPercentage: 80
    timeout: 20000
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "dashboard-card-invoice"
- assertVisible:
    id: "dashboard-card-available-limit"
- assertVisible:
    id: "dashboard-card-due-date"
- scrollUntilVisible:
    element:
      id: "dashboard-donut-card"
    direction: DOWN
    speed: 55
    visibilityPercentage: 70
    timeout: 20000
    waitToSettleTimeoutMs: 500
- assertVisible: "Gastos por Categoria"
- scrollUntilVisible:
    element:
      id: "dashboard-view-transactions-btn"
    direction: DOWN
    speed: 55
    visibilityPercentage: 80
    timeout: 15000
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "dashboard-view-transactions-btn"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "transactions-screen"
    timeout: 15000
- tapOn:
    text: "Painel"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 10000

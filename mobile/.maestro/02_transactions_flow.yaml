appId: com.cawlino.gerenciadorgastos
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 45000
- tapOn:
    text: "Transações"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "transactions-screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "tx-row-.*"
    timeout: 25000
- tapOn:
    id: "tx-filter-expense"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "month-prev"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "tx-row-.*"
    timeout: 20000
- tapOn:
    id: "tx-filter-all"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "tx-row-.*"
    timeout: 20000
- tapOn:
    id: "tx-row-.*"
    index: 0
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "transaction-detail-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "change-category-btn"
    timeout: 15000
- assertVisible:
    id: "tx-detail-amount"
- tapOn:
    id: "change-category-btn"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "category-picker-search"
    timeout: 10000
- tapOn:
    id: "category-picker-close"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: "toggle-apply-similar"
    direction: DOWN
    speed: 55
    visibilityPercentage: 80
    timeout: 15000
    waitToSettleTimeoutMs: 500
- assertVisible: "Aplicar a semelhantes"
- assertVisible:
    id: "toggle-exclude-tx"
- tapOn:
    id: "tx-detail-back-btn"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "transactions-screen"
    timeout: 10000
- tapOn:
    id: "tx-rules-btn"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "rules-screen"
    timeout: 10000
- assertVisible: "Regras de categorização"
- tapOn:
    id: "rules-back-btn"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "transactions-screen"
    timeout: 10000

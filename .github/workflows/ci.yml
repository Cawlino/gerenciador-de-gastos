name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-static:
    name: T1 Segurança & T2 Estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependências raiz
        run: npm ci

      - name: T1 - Secretlint e check-pii
        run: npm run test:t1:ci

      - name: T2 - Estática (raiz / supabase / mobile)
        run: npm run test:t2

  database-pgtap:
    name: T4 Banco de Dados (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar dependências raiz
        run: npm ci

      - name: Iniciar Supabase local
        run: npx supabase start

      - name: T4 - Banco de Dados (pgTAP)
        run: npm run test:t4
